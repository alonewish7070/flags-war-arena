<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flags War Arena</title>
<style>
:root{--cyan:#00eaff;--pink:#ff20d4;--blue:#1720a8;--panel:#050d2b;--gold:#ffdc26}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#19116c 0%,#060b27 58%,#02040d 100%);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;flex-wrap:wrap;background:linear-gradient(90deg,#07101e,#111a35,#07101e);border-bottom:1px solid #1b5a8b}
.live{background:#ff123c;padding:9px 13px;border-radius:10px;font-weight:900;box-shadow:0 0 18px #ff123c;animation:pulseLive 1.6s infinite}@keyframes pulseLive{50%{box-shadow:0 0 5px #ff123c}}.stat{border:1px solid #256aff;border-radius:12px;padding:8px 12px;background:#070c26;font-weight:bold}
h1{text-align:center;font-size:clamp(22px,4vw,40px);line-height:.95;margin:6px 0 12px;text-shadow:0 0 15px #00cfff}h1 span{color:var(--gold)}
.layout{display:grid;grid-template-columns:1fr;gap:12px;padding:12px;max-width:900px;margin:auto}
.arena{aspect-ratio:1;border:7px solid var(--cyan);border-radius:50%;position:relative;max-width:640px;width:100%;margin:auto;background:radial-gradient(circle at 50% 50%,#28205f 0 13%,#101b3b 14% 65%,#071127 100%);box-shadow:0 0 22px var(--cyan),inset 0 0 40px #203fff;overflow:hidden}
.arena:before{content:"";position:absolute;inset:5%;border:2px dashed #35caff;border-radius:50%;opacity:.7;pointer-events:none}
.obstacle-container{position:absolute;inset:0;pointer-events:none;transform-origin:center;will-change:transform;}
.obstacle{position:absolute;width:24%;height:2.4%;min-height:9px;border-radius:99px;background:linear-gradient(90deg,#9478ff,#6b5bb5);box-shadow:0 0 12px #967cff;left:50%;top:50%;transform-origin:center;pointer-events:none;opacity:.92}
.core{position:absolute;width:28%;height:28%;left:50%;top:50%;transform:translate(-50%,-50%);border:5px solid #ffc928;border-radius:50%;background:radial-gradient(circle,#22265e,#17164b);box-shadow:0 0 18px #ffcf36;pointer-events:none;z-index:1}
.core:after{content:"⚔️";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(25px,5vw,40px)}
.flag{z-index:2;position:absolute;width:clamp(28px,4.5vw,46px);height:clamp(28px,4.5vw,46px);display:grid;place-items:center;border-radius:50%;background:#0b1746;border:3px solid #48dfff;box-shadow:0 0 12px #00bfff;font-size:clamp(18px,2.5vw,28px);transform:translate(-50%,-50%);will-change:left,top;}
.flag.out{opacity:.12;filter:grayscale(1);border-color:#ff2c66;box-shadow:0 0 8px #ff2c66;transform:translate(-50%,-50%) scale(0.6);pointer-events:none;}
.flag.shielded{border-color:#00ffbd;box-shadow:0 0 20px #00ffbd,0 0 6px white}
.centerLabel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;color:#fff;text-align:center;text-shadow:0 0 10px red;font-weight:bold;pointer-events:none;z-index:3}
.notice{border:2px solid var(--pink);border-radius:15px;padding:8px;text-align:center;box-shadow:0 0 15px #a500b8;background:#0d0826}
.notice strong{color:#ff5de6;display:block;font-size:11px}
.notice div{font-size:18px;font-weight:900}
.bottom{padding:10px 14px;max-width:1000px;margin:auto}
.flagstrip{display:flex;gap:8px;overflow-x:auto;padding:8px;border:1px solid #147aff;border-radius:14px;background:#050b22}
.mini{font-size:22px;flex:0 0 auto;opacity:.95}.mini.out{opacity:.2;filter:grayscale(1)}
#winnerScreen {
display: none;
position: fixed;
inset: 0;
z-index: 9999;
background: rgba(2, 4, 20, 0.96);
align-items: center;
justify-content: center;
text-align: center;
padding: 20px;
}
#winnerScreen.show {
display: flex;
animation: winnerFade 0.6s ease;
}
.winnerBox {
width: min(700px, 100%);
padding: 30px 16px;
border: 3px solid #ffdc26;
border-radius: 24px;
background: radial-gradient(circle, #25205e, #070b24);
box-shadow: 0 0 35px #ffdc26;
}
#winnerTitle {
font-size: clamp(30px, 8vw, 64px);
color: #ffdc26;
overflow-wrap: anywhere;
}
#winnerFlag {
font-size: clamp(55px, 12vw, 90px);
}
.winnerBox button {
padding: 14px 22px;
border: 0;
border-radius: 12px;
background: #ffdc26;
color: #101020;
font-weight: bold;
font-size: 16px;
cursor: pointer;
}
@keyframes winnerFade {
from { opacity: 0; }
to { opacity: 1; }
}
</style>
</head>
<body>
<header>
  <div class="live">● LIVE (<span id="fpsDisplay">--</span> FPS)[cite: 3]</div>
  <div class="stat">COUNTRIES <span id="count">64</span>[cite: 3]</div>
  <div class="stat">REMAINING <span id="remaining">64</span>[cite: 3]</div>
  <div class="stat">SHIELDS <span id="shields">0</span>[cite: 3]</div>
</header>
<h1>WHERE ARE YOU FROM? <br><span>FLAGS WAR ARENA ⚔️</span></h1>
<div class="layout">
 <section class="center">
  <div class="arena" id="arena">
   <div class="core"></div>
   <div class="obstacle-container" id="obstacleContainer">
    <div class="obstacle" style="transform:translate(-50%,-50%) rotate(22deg) translateY(-145px)"></div>
    <div class="obstacle" style="transform:translate(-50%,-50%) rotate(-42deg) translateY(-118px)"></div>
    <div class="obstacle" style="transform:translate(-50%,-50%) rotate(8deg) translateY(145px)"></div>
    <div class="obstacle" style="transform:translate(-50%,-50%) rotate(48deg) translateY(110px)"></div>
    <div class="obstacle" style="transform:translate(-50%,-50%) rotate(-18deg) translateX(-150px)"></div>
    <div class="obstacle" style="transform:translate(-50%,-50%) rotate(18deg) translateX(150px)"></div>
   </div>
   <div class="centerLabel">LIVE<br>ARENA</div>
  </div>
  <div class="notice" style="margin-top:10px;">
    <strong>AUTO ELIMINATION STATUS</strong>
    <div id="status">ARENA LIVE — ELIMINATING EVERY 5s</div>
  </div>
 </section>
</div>
<div class="bottom">
  <div class="flagstrip" id="strip"></div>
</div>
<div id="winnerScreen" role="dialog" aria-modal="true">
  <div class="winnerBox">
    <div style="font-size:70px">🏆</div>
    <div id="winnerFlag">🇮🇳</div>
    <h2 id="winnerTitle">INDIA IS THE WINNER!</h2>
    <p id="winnerMessage">Congratulations, champion!</p>
    <button onclick="resetGame()">🔄 PLAY AGAIN</button>
  </div>
</div>

<script>
const countries = [
["United States","🇺🇸"],["China","🇨🇳"],["India","🇮🇳"],["Brazil","🇧🇷"],["Canada","🇨🇦"],["Germany","🇩🇪"],["France","🇫🇷"],["Japan","🇯🇵"],["Australia","🇦🇺"],["Russia","🇷🇺"],["South Korea","🇰🇷"],["Italy","🇮🇹"],["United Kingdom","🇬🇧"],["Mexico","🇲🇽"],["Spain","🇪🇸"],["Turkey","🇹🇷"],["Saudi Arabia","🇸🇦"],["South Africa","🇿🇦"],["Argentina","🇦🇷"],["Norway","🇳🇴"],["Sweden","🇸🇪"],["Finland","🇫🇮"],["Denmark","🇩🇰"],["Netherlands","🇳🇱"],["Belgium","🇧🇪"],["Switzerland","🇨🇭"],["Austria","🇦🇹"],["Poland","🇵🇱"],["Ukraine","🇺🇦"],["Greece","🇬🇷"],["Portugal","🇵🇹"],["Ireland","🇮🇪"],["New Zealand","🇳🇿"],["Indonesia","🇮🇩"],["Pakistan","🇵🇰"],["Bangladesh","🇧🇩"],["Nepal","🇳🇵"],["Sri Lanka","🇱🇰"],["Thailand","🇹🇭"],["Vietnam","🇻🇳"],["Philippines","🇵🇭"],["Malaysia","🇲🇾"],["Singapore","🇸🇬"],["Egypt","🇪🇬"],["Nigeria","🇳🇬"],["Kenya","🇰🇪"],["Morocco","🇲🇦"],["Algeria","🇩🇿"],["Israel","🇮🇱"],["United Arab Emirates","🇦🇪"],["Qatar","🇶🇦"],["Iran","🇮🇷"],["Iraq","🇮🇶"],["Chile","🇨🇱"],["Colombia","🇨🇴"],["Peru","🇵🇪"],["Venezuela","🇻🇪"],["Cuba","🇨🇺"],["Jamaica","🇯🇲"],["Iceland","🇮🇸"],["Romania","🇷🇴"],["Czechia","🇨🇿"],["Hungary","🇭🇺"],["Croatia","🇭🇷"]
].map(([name,flag],i)=>({name,flag,out:false,shieldUntil:0,x:0,y:0,vx:0,vy:0,id:i}));

const arena = document.getElementById('arena');
const strip = document.getElementById('strip');
const obstacleContainer = document.getElementById('obstacleContainer');

const obstacleDefs = [
  {angle: 22 * Math.PI/180, distY: -145, distX: 0, width: 0.24},
  {angle: -42 * Math.PI/180, distY: -118, distX: 0, width: 0.24},
  {angle: 8 * Math.PI/180, distY: 145, distX: 0, width: 0.24},
  {angle: 48 * Math.PI/180, distY: 110, distX: 0, width: 0.24},
  {angle: -18 * Math.PI/180, distY: 0, distX: -150, width: 0.24},
  {angle: 18 * Math.PI/180, distY: 0, distX: 150, width: 0.24}
];

countries.forEach((c, i) => {
  let el = document.createElement('div');
  el.className = 'flag';
  el.textContent = c.flag;
  el.title = c.name;
  el.id = 'flag' + i;
  arena.appendChild(el);

  let mini = document.createElement('span');
  mini.className = 'mini';
  mini.textContent = c.flag;
  mini.id = 'mini' + i;
  mini.title = c.name;
  strip.appendChild(mini);
});

function updateStats() {
  let remaining = 0, shields = 0;
  countries.forEach(c => {
    if (!c.out) remaining++;
    let el = document.getElementById('flag' + c.id);
    let mi = document.getElementById('mini' + c.id);
    el.classList.toggle('out', c.out);
    mi.classList.toggle('out', c.out);
  });
  document.getElementById('remaining').textContent = remaining;
  document.getElementById('shields').textContent = shields;
  document.getElementById('count').textContent = countries.length;
}

let gameOver = false;

function speakWinner(country) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const voice = new SpeechSynthesisUtterance(country.name + ' is the winner!');
  voice.lang = 'en-US';
  voice.rate = 0.9;
  voice.pitch = 1;
  window.speechSynthesis.speak(voice);
}

function showWinner(country) {
  gameOver = true;
  document.getElementById('winnerFlag').textContent = country.flag;
  document.getElementById('winnerTitle').textContent = country.name.toUpperCase() + ' IS THE WINNER!';
  document.getElementById('winnerMessage').textContent = 'Congratulations, ' + country.name + '!';
  document.getElementById('winnerScreen').classList.add('show');
  document.getElementById('status').textContent = country.name.toUpperCase() + ' WINS!';
  speakWinner(country);
}

function checkWinner() {
  const active = countries.filter(country => !country.out);
  if (active.length === 1 && !gameOver) {
    showWinner(active[0]);
  }
}

// Automatic Elimination every 5 seconds
setInterval(() => {
  if (gameOver) return;
  const active = countries.filter(c => !c.out);
  if (active.length > 1) {
    const victim = active[Math.floor(Math.random() * active.length)];
    victim.out = true;
    document.getElementById('status').textContent = victim.flag + ' ' + victim.name.toUpperCase() + ' ELIMINATED';
    updateStats();
    checkWinner();
  }
}, 5000);

function resetGame() {
  gameOver = false;
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  document.getElementById('winnerScreen').classList.remove('show');
  physicsReady = false;
  countries.forEach(c => {
    c.out = false;
    c.shieldUntil = 0;
  });
  document.getElementById('status').textContent = 'ARENA LIVE — ELIMINATING EVERY 5s';
  updateStats();
}

let physicsReady = false;
let lastFrame = performance.now();
let frameCount = 0;
let lastFpsUpdate = performance.now();
let globalObstacleAngle = 0;

function animateArena(ts) {
  frameCount++;
  if (ts - lastFpsUpdate >= 1000) {
    let currentFps = Math.round((frameCount * 1000) / (ts - lastFpsUpdate));
    document.getElementById('fpsDisplay').textContent = currentFps;
    frameCount = 0;
    lastFpsUpdate = ts;
  }

  const arenaWidth = arena.clientWidth;
  const arenaHeight = arena.clientHeight;
  const cx = arenaWidth / 2;
  const cy = arenaHeight / 2;
  const size = Math.min(arenaWidth, arenaHeight);
  const border = size * 0.42;
  const flagRadius = Math.max(16, arenaWidth * 0.026);

  const active = countries.filter(c => !c.out);

  if (!physicsReady && arenaWidth > 0) {
    active.forEach((c, idx) => {
      const angle = (idx / active.length) * Math.PI * 2;
      const r = (0.15 + Math.random() * 0.6) * border;
      c.x = cx + Math.cos(angle) * r;
      c.y = cy + Math.sin(angle) * r;
      const speed = 2.5 + Math.random() * 2.0;
      let a = Math.random() * Math.PI * 2;
      c.vx = Math.cos(a) * speed;
      c.vy = Math.sin(a) * speed;
    });
    physicsReady = true;
  }

  const dt = Math.min((ts - lastFrame) / 16.67, 2);
  lastFrame = ts;

  globalObstacleAngle += 0.005 * dt;
  obstacleContainer.style.transform = `rotate(${globalObstacleAngle}rad)`;

  if (physicsReady) {
    // Fast collision resolution
    for (let iter = 0; iter < 2; iter++) {
      for (let i = 0; i < active.length; i++) {
        for (let j = i + 1; j < active.length; j++) {
          let a = active[i], b = active[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let d = Math.hypot(dx, dy) || 0.01;
          let minDist = flagRadius * 2.05;

          if (d < minDist) {
            let nx = dx / d;
            let ny = dy / d;
            let overlap = (minDist - d) * 0.5;

            a.x -= nx * overlap;
            a.y -= ny * overlap;
            b.x += nx * overlap;
            b.y += ny * overlap;

            let kx = a.vx - b.vx;
            let ky = a.vy - b.vy;
            let p = (nx * kx + ny * ky);

            if (p > 0) {
              a.vx -= p * nx * 1.2;
              a.vy -= p * ny * 1.2;
              b.vx += p * nx * 1.2;
              b.vy += p * ny * 1.2;
            }
          }
        }
      }
    }

    active.forEach(c => {
      c.x += c.vx * dt;
      c.y += c.vy * dt;

      let dx = c.x - cx;
      let dy = c.y - cy;
      let dist = Math.hypot(dx, dy) || 1;

      if (dist > border - flagRadius) {
        let nx = dx / dist;
        let ny = dy / dist;
        c.x = cx + nx * (border - flagRadius);
        c.y = cy + ny * (border - flagRadius);
        let dot = c.vx * nx + c.vy * ny;
        c.vx -= 2.2 * dot * nx;
        c.vy -= 2.2 * dot * ny;
      }
    });

    active.forEach(c => {
      const coreRadius = arenaWidth * 0.15;
      let cdx = c.x - cx, cdy = c.y - cy, cdist = Math.hypot(cdx, cdy);
      if (cdist < coreRadius + flagRadius) {
        let nx = cdx / cdist, ny = cdy / cdist;
        c.x = cx + nx * (coreRadius + flagRadius);
        c.y = cy + ny * (coreRadius + flagRadius);
        let dot = c.vx * nx + c.vy * ny;
        if (dot < 0) { c.vx -= 2 * dot * nx; c.vy -= 2 * dot * ny; }
      }

      obstacleDefs.forEach(ob => {
        let localAngle = ob.angle + globalObstacleAngle;
        let obX = cx + ob.distX * Math.cos(globalObstacleAngle) - ob.distY * Math.sin(globalObstacleAngle);
        let obY = cy + ob.distX * Math.sin(globalObstacleAngle) + ob.distY * Math.cos(globalObstacleAngle);

        let len = arenaWidth * ob.width;
        let ux = Math.cos(localAngle);
        let uy = Math.sin(localAngle);

        let ax = obX - ux * len / 2;
        let ay = obY - uy * len / 2;
        let bx = obX + ux * len / 2;
        let by = obY + uy * len / 2;

        let vx = bx - ax;
        let vy = by - ay;
        let denom = vx * vx + vy * vy || 1;
        let t = Math.max(0, Math.min(1, ((c.x - ax) * vx + (c.y - ay) * vy) / denom));
        
        let qx = ax + t * vx;
        let qy = ay + t * vy;
        let dx = c.x - qx;
        let dy = c.y - qy;
        let d = Math.hypot(dx, dy) || 0.01;
        let minAllowed = flagRadius + 6;

        if (d < minAllowed) {
          let nx = dx / d;
          let ny = dy / d;
          c.x = qx + nx * minAllowed;
          c.y = qy + ny * minAllowed;
          let dot = c.vx * nx + c.vy * ny;
          if (dot < 0) {
            c.vx -= 2.2 * dot * nx;
            c.vy -= 2.2 * dot * ny;
          }
        }
      });
    });
  }

  countries.forEach(c => {
    let el = document.getElementById('flag' + c.id);
    if (Number.isFinite(c.x)) {
      el.style.left = c.x + 'px';
      el.style.top = c.y + 'px';
    }
  });

  requestAnimationFrame(animateArena);
}

requestAnimationFrame(animateArena);
updateStats();
</script>
</body>
</html>
