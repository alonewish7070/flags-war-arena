
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flags War Arena</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#050817;color:white;
 font-family:Arial,Helvetica,sans-serif
}
#game{
 position:relative;width:100%;height:100dvh;overflow:hidden;
 background:radial-gradient(ellipse at center,#19285a 0%,#090e25 55%,#030510 100%);
}
#top{
 position:absolute;top:3%;width:100%;text-align:center;z-index:5;
 font-size:clamp(24px,6vw,42px);font-weight:1000;
 letter-spacing:2px;color:#ffe45c;
 text-shadow:0 3px #9d3819,0 0 20px #ffb323;
}
#subtitle{
 position:absolute;top:10%;width:100%;text-align:center;
 color:#a9faff;font-size:10px;letter-spacing:3px;
}
#arena{
 position:absolute;left:50%;top:47%;
 transform:translate(-50%,-50%);
 width:min(94vw,72vh);aspect-ratio:1;border-radius:50%;
 border:3px solid #00eaff;
 box-shadow:0 0 12px #00eaff,0 0 40px #007bff66,
 inset 0 0 30px #00bfff55;
 background:radial-gradient(circle,#151f4e,#080d27 75%);
 overflow:hidden;
}
#rotating{
 position:absolute;inset:4%;border:2px dashed #00eaff88;
 border-radius:50%;animation:spin 15s linear infinite;
}
#rotating:before{
 content:"";position:absolute;inset:12%;border:1px solid #ffdf4d77;
 border-radius:50%;
}
#rotating:after{
 content:"";position:absolute;inset:28%;
 border:1px dashed #6cf8ff99;border-radius:50%;
}
@keyframes spin{to{transform:rotate(360deg)}}
#balls{position:absolute;inset:0}
.ball{
 position:absolute;width:7.3%;aspect-ratio:1;
 display:flex;align-items:center;justify-content:center;
 border-radius:50%;
 background:linear-gradient(145deg,#fff,#b6c9ed 65%,#52699a);
 border:1px solid white;
 box-shadow:0 2px 5px #0009,0 0 8px #8deaff66;
 font-size:clamp(15px,4vw,24px);
 transform:translate(-50%,-50%);
 will-change:left,top,transform,opacity;
 user-select:none;
}
.ball span{filter:drop-shadow(0 1px 1px #555)}
#center{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:27%;aspect-ratio:1;border-radius:50%;
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;text-align:center;
 background:radial-gradient(circle,#283c84,#0a1235);
 border:2px solid #ffe04b;
 box-shadow:0 0 20px #ffcc4477;
 z-index:3;
}
#star{font-size:clamp(24px,6vw,38px);color:#ffe45c}
#centerText{font-size:clamp(8px,2.2vw,12px);font-weight:900;letter-spacing:1px}
#announcement{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%) scale(.5);
 opacity:0;z-index:10;pointer-events:none;
 width:90%;text-align:center;
 font-size:clamp(21px,6vw,38px);font-weight:1000;
 color:white;text-shadow:0 3px #8b1111,0 0 20px #ffda38;
 background:linear-gradient(90deg,#e92d20,#ff9e18,#e92d20);
 border:2px solid #ffe66a;border-radius:8px;
 padding:15px 5px;
 transition:transform .25s,opacity .25s;
}
#announcement.show{
 opacity:1;transform:translate(-50%,-50%) scale(1);
}
#bottom{
 position:absolute;top:calc(47% + min(47vw,36vh) + 3%);
 width:100%;text-align:center;font-size:clamp(15px,4vw,23px);
 font-weight:1000;letter-spacing:2px;color:#fff;
 text-shadow:0 0 12px #00cfff;
}
#stats{
 position:absolute;bottom:10%;left:3%;width:94%;
 display:flex;justify-content:space-between;gap:8px;
}
.pill{
 padding:9px 12px;border-radius:30px;
 border:1px solid #4c75b8;background:#101a38;
 font-size:clamp(10px,2.8vw,14px);font-weight:900;
}
#last{
 position:absolute;bottom:5.5%;width:100%;text-align:center;
 font-size:11px;color:#b5c7e8;letter-spacing:1px;
}
#controls{
 position:absolute;bottom:0;width:100%;height:5%;
 min-height:38px;display:flex;justify-content:center;gap:8px;
 align-items:center;background:#050918;border-top:1px solid #28385c;
}
button{
 border:1px solid #00cfff;background:#10244b;color:white;
 border-radius:20px;padding:6px 12px;font-weight:bold;
 font-size:11px;
}
#win{
 position:absolute;inset:0;z-index:20;
 display:none;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;
 background:#030715ed;
}
#win h1{font-size:clamp(35px,10vw,65px);color:#ffe45c;
 text-shadow:0 0 25px orange;margin:10px}
#winnerFlag{font-size:90px}
#win p{font-size:20px;font-weight:bold}
@media(min-width:700px){
 #arena{width:min(75vh,650px)}
}
</style>
</head>

<body>
<div id="game">

 <div id="top">YOU FROM?</div>
 <div id="subtitle">FLAGS WAR ARENA • BATTLE ROYALE</div>

 <div id="arena">
  <div id="rotating"></div>
  <div id="balls"></div>

  <div id="center">
   <div id="star">✦</div>
   <div id="centerText">FLAG<br>BATTLE</div>
  </div>

  <div id="announcement"></div>
 </div>

 <div id="bottom">ALL ELIMINATED</div>

 <div id="stats">
  <div class="pill" id="remaining">COUNTRIES 64</div>
  <div class="pill" id="timer">NEXT OUT 5.0s</div>
 </div>

 <div id="last">LAST ELIMINATED: —</div>

 <div id="controls">
  <button id="restart">↻ RESTART</button>
  <button id="pause">Ⅱ PAUSE</button>
  <button id="speed">⚡ SPEED ×1</button>
 </div>

 <div id="win">
  <div id="winnerFlag">🏆</div>
  <h1>WINNER!</h1>
  <p id="winnerName"></p>
  <button onclick="startGame()">PLAY AGAIN</button>
 </div>
</div>

<script>
const countries=[
["🇺🇸","USA"],["🇨🇳","CHINA"],["🇮🇳","INDIA"],["🇧🇷","BRAZIL"],
["🇯🇵","JAPAN"],["🇬🇧","UK"],["🇫🇷","FRANCE"],["🇩🇪","GERMANY"],
["🇨🇦","CANADA"],["🇲🇽","MEXICO"],["🇰🇷","SOUTH KOREA"],["🇷🇺","RUSSIA"],
["🇦🇺","AUSTRALIA"],["🇮🇹","ITALY"],["🇪🇸","SPAIN"],["🇹🇷","TURKEY"],
["🇮🇩","INDONESIA"],["🇵🇰","PAKISTAN"],["🇸🇦","SAUDI ARABIA"],["🇿🇦","SOUTH AFRICA"],
["🇦🇷","ARGENTINA"],["🇳🇬","NIGERIA"],["🇪🇬","EGYPT"],["🇹🇭","THAILAND"],
["🇻🇳","VIETNAM"],["🇵🇭","PHILIPPINES"],["🇵🇱","POLAND"],["🇺🇦","UKRAINE"],
["🇳🇱","NETHERLANDS"],["🇸🇪","SWEDEN"],["🇳🇴","NORWAY"],["🇨🇭","SWITZERLAND"],
["🇳🇿","NEW ZEALAND"],["🇵🇹","PORTUGAL"],["🇬🇷","GREECE"],["🇮🇱","ISRAEL"],
["🇮🇷","IRAN"],["🇮🇶","IRAQ"],["🇦🇫","AFGHANISTAN"],["🇧🇩","BANGLADESH"],
["🇱🇰","SRI LANKA"],["🇳🇵","NEPAL"],["🇲🇾","MALAYSIA"],["🇸🇬","SINGAPORE"],
["🇰🇪","KENYA"],["🇬🇭","GHANA"],["🇨🇱","CHILE"],["🇨🇴","COLOMBIA"],
["🇵🇪","PERU"],["🇨🇺","CUBA"],["🇯🇲","JAMAICA"],["🇮🇪","IRELAND"],
["🇧🇪","BELGIUM"],["🇦🇹","AUSTRIA"],["🇩🇰","DENMARK"],["🇫🇮","FINLAND"],
["🇨🇿","CZECHIA"],["🇷🇴","ROMANIA"],["🇭🇺","HUNGARY"],["🇶🇦","QATAR"],
["🇦🇪","UAE"],["🇲🇦","MOROCCO"],["🇹🇳","TUNISIA"],["🇨🇷","COSTA RICA"]
];

const arena=document.getElementById("arena");
const container=document.getElementById("balls");
let balls=[],paused=false,speed=1,last=0,remaining=5,raf=null;
let finished=false,announcementTimeout=null;

function showMessage(message){
 const el=document.getElementById("announcement");
 el.textContent=message;
 el.classList.add("show");
 clearTimeout(announcementTimeout);
 announcementTimeout=setTimeout(()=>el.classList.remove("show"),1300);
}

function updateStats(){
 const alive=balls.filter(b=>b.alive);
 document.getElementById("remaining").textContent="COUNTRIES "+alive.length;
 return alive;
}

function eliminate(){
 const alive=updateStats();

 if(alive.length<=1){
  if(alive.length===1)declareWinner(alive[0]);
  return;
 }

 const victim=alive[Math.floor(Math.random()*alive.length)];
 victim.alive=false;
 victim.el.style.transition="transform .25s,opacity .25s";
 victim.el.style.opacity="0";
 victim.el.style.transform="translate(-50%,-50%) scale(0) rotate(180deg)";

 document.getElementById("last").textContent=
  "LAST ELIMINATED: "+victim.name;

 showMessage(victim.flag+" "+victim.name+" OUT!");

 setTimeout(()=>victim.el.remove(),300);

 const left=alive.filter(b=>b!==victim);
 document.getElementById("bottom").textContent=
  left.length<=1 ? "FINAL BATTLE" : "ALL ELIMINATED";
}

function declareWinner(winner){
 if(finished)return;
 finished=true;
 document.getElementById("winnerFlag").textContent=winner.flag;
 document.getElementById("winnerName").textContent=winner.name;
 document.getElementById("win").style.display="flex";
}

function startGame(){
 cancelAnimationFrame(raf);
 clearTimeout(announcementTimeout);

 container.innerHTML="";
 document.getElementById("win").style.display="none";
 document.getElementById("bottom").textContent="ALL ELIMINATED";
 document.getElementById("last").textContent="LAST ELIMINATED: —";
 document.getElementById("announcement").classList.remove("show");

 balls=[];
 paused=false;
 speed=1;
 remaining=5;
 finished=false;

 document.getElementById("pause").textContent="Ⅱ PAUSE";
 document.getElementById("speed").textContent="⚡ SPEED ×1";

 countries.forEach(([flag,name])=>{
  const el=document.createElement("div");
  el.className="ball";
  el.innerHTML="<span>"+flag+"</span>";
  el.title=name;
  container.appendChild(el);

  const angle=Math.random()*Math.PI*2;
  const radius=Math.sqrt(Math.random())*.40;

  balls.push({
   el,flag,name,alive:true,
   x:.5+Math.cos(angle)*radius,
   y:.5+Math.sin(angle)*radius,
   vx:(Math.random()-.5)*.28,
   vy:(Math.random()-.5)*.28,
   phase:Math.random()*6
  });
 });

 updateStats();
 last=performance.now();
 raf=requestAnimationFrame(loop);
}

function loop(now){
 raf=requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.035);
 last=now;
 if(paused||finished)return;

 const elapsed=now/1000;
 remaining-=dt*speed;

 document.getElementById("timer").textContent=
  "NEXT OUT "+Math.max(0,remaining).toFixed(1)+"s";

 balls.forEach((b,i)=>{
  if(!b.alive)return;

  b.phase+=dt*2;
  b.vx+=Math.sin(elapsed*1.3+b.phase)*dt*.025;
  b.vy+=Math.cos(elapsed+b.phase)*dt*.025;

  // Smooth movement with controlled velocity
  b.vx=Math.max(-.25,Math.min(.25,b.vx));
  b.vy=Math.max(-.25,Math.min(.25,b.vy));

  b.x+=b.vx*dt*speed;
  b.y+=b.vy*dt*speed;

  // Bounce from circular arena boundary
  let dx=b.x-.5,dy=b.y-.5;
  let dist=Math.hypot(dx,dy);
  const maxR=.455;

  if(dist>maxR){
   const nx=dx/dist,ny=dy/dist;
   b.x=.5+nx*maxR;
   b.y=.5+ny*maxR;

   const dot=b.vx*nx+b.vy*ny;
   b.vx-=2*dot*nx;
   b.vy-=2*dot*ny;
  }

  // Flag-to-flag collisions
  for(let j=i+1;j<balls.length;j++){
   const other=balls[j];
   if(!other.alive)continue;

   let ax=b.x-other.x,ay=b.y-other.y;
   let d=Math.hypot(ax,ay)||.001;
   const min=.073;

   if(d<min){
    const nx=ax/d,ny=ay/d;
    const push=(min-d)*.5;

    b.x+=nx*push;
    b.y+=ny*push;
    other.x-=nx*push;
    other.y-=ny*push;

    const relative=(b.vx-other.vx)*nx+
                   (b.vy-other.vy)*ny;

    if(relative<0){
     b.vx-=relative*nx;
     b.vy-=relative*ny;
     other.vx+=relative*nx;
     other.vy+=relative*ny;
    }
   }
  }

  b.el.style.left=(b.x*100)+"%";
  b.el.style.top=(b.y*100)+"%";
  b.el.style.transform=
   "translate(-50%,-50%) rotate("+Math.sin(b.phase)*8+"deg)";
 });

 if(remaining<=0){
  eliminate();
  remaining=5;
 }
}

document.getElementById("restart").onclick=startGame;

document.getElementById("pause").onclick=()=>{
 paused=!paused;
 document.getElementById("pause").textContent=
  paused?"▶ RESUME":"Ⅱ PAUSE";
 last=performance.now();
};

document.getElementById("speed").onclick=()=>{
 speed=speed===1?1.5:1;
 document.getElementById("speed").textContent=
  speed===1?"⚡ SPEED ×1":"⚡ SPEED ×1.5";
};

startGame();
</script>
</body>
</html>
